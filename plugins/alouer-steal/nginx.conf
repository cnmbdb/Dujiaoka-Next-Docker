location = /plugins/alouer-steal/static/inject.js {
    set $alouer_steal_upstream dujiao-plugin-alouer-steal;
    proxy_pass http://$alouer_steal_upstream:80/inject.js;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

location ^~ /plugins/alouer-steal/ {
    set $alouer_steal_upstream dujiao-plugin-alouer-steal;
    rewrite ^/plugins/alouer-steal/(.*)$ /alouer-steal/$1 break;
    proxy_pass http://$alouer_steal_upstream:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /alouer-steal/ {
    set $alouer_steal_upstream dujiao-plugin-alouer-steal;
    proxy_pass http://$alouer_steal_upstream:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

location ^~ /api/alouer/ {
    set $alouer_steal_upstream dujiao-plugin-alouer-steal;
    proxy_pass http://$alouer_steal_upstream:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
